module:
  hugoVersion:
    min: "0.163.0"
    extended: true
  mounts:
  - source: content
    target: content
  - source: static
    target: static
  - source: layouts
    target: layouts
  - source: data
    target: data
  - source: assets
    target: assets
  - source: i18n
    target: i18n
  - source: archetypes
    target: archetypes
  - source: ../../node_modules/flag-icons/flags
    target: static/flags
  - source: ./node_modules/flag-icons/flags
    target: static/flags
  - source: ../../node_modules/@fontsource/poppins/files
    target: static/files
  - source: ./node_modules/@fontsource/poppins/files
    target: static/files
  - source: ../../node_modules/mathjax/es5/output/chtml/fonts/woff-v2
    target: static/fonts/mathjax
  - source: ./node_modules/mathjax/es5/output/chtml/fonts/woff-v2
    target: static/fonts/mathjax
  - source: ../../node_modules/@awesome.me/kit-f6f8bfcfbd/icons/webfonts
    target: static/webfonts
  - source: ./node_modules/@awesome.me/kit-f6f8bfcfbd/icons/webfonts
    target: static/webfonts

