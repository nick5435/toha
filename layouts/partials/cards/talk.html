{{ $dataCategories:= slice "talk-all"}}
{{ range .categories}}
  {{ $dataCategories = $dataCategories | append (printf "pub-%s" .)}}
{{end}}

<div
  class="col-12 p-2 talk-filtr-item"
  data-category='{{ delimit $dataCategories ","}}'
>
  <div class="card mt-3">
    <div class="card-header">
      <h3 class="card-title h5 mb-0">{{ .title }}</h3>
      <div class="sub-title">
        <span class="ms-0">{{.location | markdownify}}</span>
        <span class="ms-2">{{ .date }}</span>
      </div>
    </div>
    <div class="card-body">
      <div class="abstract mb-3">{{ .abstract | markdownify }}</div>
    </div>
    <div class="card-footer">
      <div class="tags">
        {{ range $index,$tag:= .tags }}
            <span class="btn badge btn-info ms-1 p-1">
              {{ $tag }}
            </span>
        {{ end }}
      </div>
    </div>
  </div>
</div>
